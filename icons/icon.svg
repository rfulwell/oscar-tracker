<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#b8960c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  
  <!-- Trophy -->
  <g transform="translate(256, 256) scale(0.6) translate(-256, -256)">
    <!-- Cup body -->
    <path d="M256 380 C256 380 156 300 156 190 L156 100 L356 100 L356 190 C356 300 256 380 256 380 Z" 
          fill="url(#gold)" 
          stroke="#f4d03f" 
          stroke-width="4"/>
    
    <!-- Left handle -->
    <path d="M156 120 L96 120 L96 160 C96 220 126 260 156 260" 
          fill="none" 
          stroke="url(#gold)" 
          stroke-width="20" 
          stroke-linecap="round"/>
    
    <!-- Right handle -->
    <path d="M356 120 L416 120 L416 160 C416 220 386 260 356 260" 
          fill="none" 
          stroke="url(#gold)" 
          stroke-width="20" 
          stroke-linecap="round"/>
    
    <!-- Stem -->
    <rect x="236" y="380" width="40" height="60" fill="url(#gold)"/>
    
    <!-- Base top -->
    <rect x="196" y="430" width="120" height="20" rx="4" fill="url(#gold)"/>
    
    <!-- Base bottom -->
    <rect x="166" y="450" width="180" height="24" rx="4" fill="url(#gold)"/>
  </g>
</svg>
