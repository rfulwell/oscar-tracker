name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/update-2026-Z1D9s
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job - runs on every push
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        run: |
          # Generate version: 1.1.{run_number}
          VERSION="1.1.${{ github.run_number }}"
          echo "Deploying version: $VERSION"

          # Update APP_VERSION in app.js
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$VERSION'/" app.js

          # Update version in package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          # Verify the update
          grep "APP_VERSION" app.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deploy job - requires manual approval via environment protection rules
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
