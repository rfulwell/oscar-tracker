name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild PR previews (/preview/pr-<number>/) when a PR into main opens,
  # changes or closes. pull_request_target runs this workflow from main, the
  # only branch allowed to deploy Pages. It must never run code from the PR:
  # the preview script runs from main's checkout and only copies the PR's files.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read  # List open PRs for previews

concurrency:
  group: "pages"
  # Let a running deploy finish; a newer run waits, and only the latest waiting run goes next
  cancel-in-progress: false

jobs:
  test:
    # Skip everything for PRs from forks: this workflow can deploy the site.
    # Tests run on main's code (never the PR's), since every deploy republishes the live site.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Don't leave the token in git for later steps. Nothing here pushes, and
          # the preview script's `git fetch` of PR branches works without it while
          # the repo is public.
          persist-credentials: false

      - name: Bump version
        run: |
          # Generate version: 1.2.{run_number}
          VERSION="1.2.${{ github.run_number }}"
          echo "Deploying version: $VERSION"

          # Update APP_VERSION in app.js
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$VERSION'/" app.js

          # Stamp the service worker with the commit so every deploy reaches installed clients
          SW_VERSION="${GITHUB_SHA::7}"
          sed -i "s/const SW_VERSION = '[^']*'/const SW_VERSION = '$SW_VERSION'/" sw.js

          # Verify the updates (fail the deploy if either replacement didn't happen)
          grep "const APP_VERSION = '$VERSION'" app.js
          grep "const SW_VERSION = '$SW_VERSION'" sw.js

      - name: Build site
        # Only the files listed in .github/site-files.txt are published
        run: python3 .github/scripts/build_site.py . _site

      - name: Build PR previews
        # A failed preview is listed on /preview/ and never blocks the live deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_previews.py _site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
