name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        run: |
          # Generate version: 1.2.{run_number}
          VERSION="1.2.${{ github.run_number }}"
          echo "Deploying version: $VERSION"

          # Update APP_VERSION in app.js
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$VERSION'/" app.js

          # Update version in package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          # Stamp the service worker with the commit so every deploy reaches installed clients
          SW_VERSION="${GITHUB_SHA::7}"
          sed -i "s/const SW_VERSION = '[^']*'/const SW_VERSION = '$SW_VERSION'/" sw.js

          # Verify the updates (fail the deploy if either replacement didn't happen)
          grep "const APP_VERSION = '$VERSION'" app.js
          grep "const SW_VERSION = '$SW_VERSION'" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
